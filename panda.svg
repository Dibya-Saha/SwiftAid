<svg width="480" height="390" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dustGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7ccc8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d7ccc8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="210" cy="240" rx="46" ry="10" fill="#000000" opacity="0.15">
    <animate attributeName="rx" values="10;10;50;42;42;10" keyTimes="0;0.36;0.42;0.5;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.22;0.15;0.15;0" keyTimes="0;0.36;0.42;0.5;0.9;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== flying, spinning barrel ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-40,10; 60,-60; 150,-90; 220,-40; 210,150; 210,150"
      keyTimes="0; 0.15; 0.25; 0.34; 0.42; 1"
      dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="1; 1; 1; 1; 0; 0"
      keyTimes="0; 0.34; 0.38; 0.41; 0.42; 1"
      dur="9s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0; 1080; 1080" keyTimes="0; 0.42; 1" dur="9s" repeatCount="indefinite"/>

      <!-- squash on impact -->
      <g>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1,1; 1,1; 1.3,0.7; 1,1; 1,1" keyTimes="0;0.4;0.42;0.44;1"
          dur="9s" repeatCount="indefinite"/>

        <rect x="-32.5" y="-40" width="65" height="80" rx="20" fill="#a56a3a" stroke="#5c3a1e" stroke-width="3.5"/>
        <rect x="-32.5" y="-27.5" width="65" height="9" fill="#5c3a1e"/>
        <rect x="-32.5" y="-2.5" width="65" height="9" fill="#5c3a1e"/>
        <rect x="-32.5" y="22.5" width="65" height="9" fill="#5c3a1e"/>
        <ellipse cx="0" cy="-40" rx="32.5" ry="11.25" fill="#c68a52" stroke="#5c3a1e" stroke-width="3.5"/>
      </g>
    </g>
  </g>

  <!-- ===== impact dust burst ===== -->
  <g transform="translate(210,225)">
    <circle r="6" fill="url(#dustGrad)">
      <animate attributeName="r" values="4;4;46;4" keyTimes="0;0.4;0.5;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.8;0" keyTimes="0;0.4;0.46;0.55" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-18" cy="-4" r="5" fill="#c9b8ad" opacity="0">
      <animate attributeName="cx" values="0;-18;-34" keyTimes="0;0.4;0.5" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;-4;-2" keyTimes="0;0.4;0.5" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" keyTimes="0.4;0.42;0.5" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="-6" r="5" fill="#c9b8ad" opacity="0">
      <animate attributeName="cx" values="0;20;38" keyTimes="0;0.4;0.5" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;-6;-2" keyTimes="0;0.4;0.5" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" keyTimes="0.4;0.42;0.5" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== cracked barrel halves + lid + panda ===== -->
  <g transform="translate(210,190)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.41;0.44;0.86;0.92;1" dur="9s" repeatCount="indefinite"/>

    <!-- left half -->
    <path d="M-32.5,-40 Q-37.5,0 -32.5,40 L-2.5,40 Q-7.5,0 -2.5,-40 Z" fill="#a56a3a" stroke="#5c3a1e" stroke-width="3.5">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,0; -40,-12; -48,-5" keyTimes="0;0.44;0.6;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0; 0; -35; -30" keyTimes="0;0.44;0.6;1" dur="9s" repeatCount="indefinite"/>
    </path>
    <!-- right half -->
    <path d="M32.5,-40 Q37.5,0 32.5,40 L2.5,40 Q7.5,0 2.5,-40 Z" fill="#a56a3a" stroke="#5c3a1e" stroke-width="3.5">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,0; 40,-12; 48,-5" keyTimes="0;0.44;0.6;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0; 0; 35; 30" keyTimes="0;0.44;0.6;1" dur="9s" repeatCount="indefinite"/>
    </path>
    <!-- lid flying off -->
    <ellipse cx="0" cy="-40" rx="32.5" ry="11.25" fill="#c68a52" stroke="#5c3a1e" stroke-width="3.5">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,0; -10,-70; -14,-110" keyTimes="0;0.44;0.6;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0; 0; 220; 260" keyTimes="0;0.44;0.6;1" dur="9s" repeatCount="indefinite"/>
    </ellipse>

    <!-- sparkle stars -->
    <g fill="#ffd54f">
      <path d="M-46,-20 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 Z" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.44;0.5;0.62" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M48,-24 l2.5,7 l7,2.5 l-7,2.5 l-2.5,7 l-2.5,-7 l-7,-2.5 l7,-2.5 Z" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.46;0.52;0.64" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M0,-58 l2.5,7 l7,2.5 l-7,2.5 l-2.5,7 l-2.5,-7 l-7,-2.5 l7,-2.5 Z" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.48;0.54;0.66" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- panda popping out -->
    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="0.1,0.1; 0.1,0.1; 1.25,1.25; 0.9,0.9; 1,1; 1,1.04; 1,1"
        keyTimes="0; 0.43; 0.48; 0.51; 0.54; 0.7; 0.86"
        dur="9s" repeatCount="indefinite"/>

      <!-- body -->
      <ellipse cx="0" cy="6" rx="20" ry="24" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>

      <!-- arms thrown up -->
      <ellipse cx="-24" cy="-14" rx="8" ry="14" fill="#2b2b2b" transform="rotate(-45 -24 -14)"/>
      <ellipse cx="24" cy="-14" rx="8" ry="14" fill="#2b2b2b" transform="rotate(45 24 -14)"/>

      <!-- head -->
      <circle cx="-14" cy="-32" r="8" fill="#2b2b2b"/>
      <circle cx="14" cy="-32" r="8" fill="#2b2b2b"/>
      <circle cx="0" cy="-22" r="22" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
      <ellipse cx="-9" cy="-24" rx="7" ry="8.5" fill="#2b2b2b" transform="rotate(-12 -9 -24)"/>
      <ellipse cx="9" cy="-24" rx="7" ry="8.5" fill="#2b2b2b" transform="rotate(12 9 -24)"/>
      <circle cx="-8" cy="-23" r="2.6" fill="#ffffff"/>
      <circle cx="8" cy="-23" r="2.6" fill="#ffffff"/>
      <circle cx="-8" cy="-23" r="1.3" fill="#111111"/>
      <circle cx="8" cy="-23" r="1.3" fill="#111111"/>
      <ellipse cx="0" cy="-15" rx="2.8" ry="2" fill="#2b2b2b"/>
      <path d="M0,-13 Q0,-6 -8,-6" fill="none" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M0,-13 Q0,-6 8,-6" fill="none" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- speech bubble greeting -->
    <g transform="translate(-5,-124)">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="0.1,0.1; 0.1,0.1; 1.15,1.15; 0.95,0.95; 1,1; 1,1"
        keyTimes="0; 0.48; 0.53; 0.56; 0.59; 1"
        dur="9s" repeatCount="indefinite"/>

      <path d="M-15,28 L5,28 L-3,46 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
      <rect x="-90" y="-28" width="180" height="56" rx="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
      <text x="0" y="7" text-anchor="middle" font-size="19" font-weight="600"><tspan fill="#e53935" font-family="Trebuchet MS, sans-serif" font-weight="700">H</tspan><tspan fill="#fb8c00" font-family="Georgia, serif" font-style="italic">i</tspan><tspan fill="#2b2b2b" font-family="sans-serif">, </tspan><tspan fill="#43a047" font-family="Courier New, monospace" font-weight="700">I</tspan><tspan fill="#2b2b2b" font-family="sans-serif">'</tspan><tspan fill="#1e88e5" font-family="Comic Sans MS, cursive">m </tspan><tspan fill="#8e24aa" font-family="Trebuchet MS, sans-serif" font-weight="700">D</tspan><tspan fill="#00897b" font-family="Georgia, serif" font-style="italic">i</tspan><tspan fill="#f4511e" font-family="Courier New, monospace">b</tspan><tspan fill="#3949ab" font-family="Comic Sans MS, cursive" font-style="italic">y</tspan><tspan fill="#c0ca33" font-family="Trebuchet MS, sans-serif" font-weight="700">a</tspan></text>
    </g>
  </g>
</svg>
